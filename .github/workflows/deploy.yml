name: Deploy

on:
  push:
    branches: [main, dev]   # main → 本番 (mado.blue) / dev → プレビュー (dev.mado-sveltekit.pages.dev)

jobs:
  deploy-app:
    name: Deploy Pages (mado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ★存在しない色クラスの検査。書いても黙って何も起きないので目では拾えない
      #   （bg-primary-light が7箇所で空振りしていた）

      - run: npm run build

      # ---- D1 マイグレーション ----
      # ★本番の d1_migrations は 2026-09-02 まで空だった（それ以前は
      #   `wrangler d1 execute --file` で手流ししていて台帳に載らなかった）。
      #   そのまま自動化すると 0003 の ALTER TABLE ADD COLUMN が
      #   「duplicate column name」で落ちるので、先に台帳へ4行入れて実態と合わせてある。
      - name: Apply D1 migrations (production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations (staging)
        if: github.ref == 'refs/heads/dev'
        run: npx wrangler d1 migrations apply DB --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # --branch で Pages のプレビュー環境に振り分ける。main は production。
      # ★プロジェクト名は mado。ドメインは mado-sveltekit.pages.dev。
      #   作成時の名前が mado-sveltekit で、後で mado にリネームしたが *.pages.dev の
      #   サブドメインは作成時のまま残る。URL からプロジェクト名を推測すると間違える
      #   （2026-08-22〜09-02 の11日間、ここが mado-sveltekit でデプロイが全部失敗していた）。
      # ★出力の URL を Actions のサマリに出す。ブランチ別名は dev.mado-sveltekit.pages.dev。
      - name: Deploy
        id: deploy
        run: |
          npx wrangler pages deploy .svelte-kit/cloudflare \
            --project-name mado --branch ${{ github.ref_name }} | tee /tmp/deploy.log
          {
            echo "### Pages デプロイ（${{ github.ref_name }}）"
            echo ''
            grep -oE 'https://[a-z0-9.-]+\.pages\.dev[^ ]*' /tmp/deploy.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cron:
    name: Deploy Cron Worker (mado-cron)
    # cron は本番が1つだけ。dev から流すと本番の cron を上書きするので main 限定
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        working-directory: cron-worker
      - run: npx wrangler deploy
        working-directory: cron-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
