name: Deploy

on:
  push:
    branches: [main, dev]   # main → 本番 (mado.blue) / dev → プレビュー (dev.mado.pages.dev)

jobs:
  deploy-app:
    name: Deploy Pages (mado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # --branch で Pages のプレビュー環境に振り分ける。main は production。
      # ★出力の URL を Actions のサマリに出す。ブランチ別名（dev.mado.pages.dev）が
      #   出ないことがあるので、一意 URL を必ず辿れるようにしておく。
      - name: Deploy
        id: deploy
        run: |
          npx wrangler pages deploy .svelte-kit/cloudflare \
            --project-name mado-sveltekit --branch ${{ github.ref_name }} | tee /tmp/deploy.log
          {
            echo "### Pages デプロイ（${{ github.ref_name }}）"
            echo ''
            grep -oE 'https://[a-z0-9.-]+\.pages\.dev[^ ]*' /tmp/deploy.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cron:
    name: Deploy Cron Worker (mado-cron)
    # cron は本番が1つだけ。dev から流すと本番の cron を上書きするので main 限定
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        working-directory: cron-worker
      - run: npx wrangler deploy
        working-directory: cron-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
